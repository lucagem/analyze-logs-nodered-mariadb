name: log_analyzer
description: "Desktop log analyzer for MariaDB and Node-RED container logs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  file_picker: ^8.1.4
  intl: ^0.19.0
  path_provider: ^2.1.5
  markdown_widget: ^2.3.2+8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules.json
